[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lpe-stgtn-reproduction"
version = "0.1.0"
description = "Research-grade reproduction scaffold for LPE-STGTN taxi demand forecasting."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Ride-hailing reproduction team" },
]
dependencies = [
  "networkx>=3.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pyproj>=3.7",
  "PyYAML>=6.0.1",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.11",
  "types-PyYAML>=6.0.12.20241230",
]

[project.scripts]
lpe-stgtn = "lpe_stgtn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lpe_stgtn"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["lpe_stgtn"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
